<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAFE</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/index.css">

</head>

<body>

<div class="marca-gibabit">
    <img src="assets/logo-gibabit.png" alt="Gibabit">
</div>

<div class="pagina-inicial">

    <div class="logo-safe">
        <i class="bi bi-clipboard2-pulse"></i>
    </div>

    <h1>SAFE</h1>

    <p>Sistema de Avaliação Física Escolar</p>

    <div class="cards">

        <a href="aluno.html" class="card">
            <i class="bi bi-person-walking"></i>
            <span>Área do Aluno</span>
        </a>

        <a href="funcionario.html" class="card">
            <i class="bi bi-person-vcard"></i>
            <span>Área do Funcionário</span>
        </a>

    </div>

    <a href="login.html" class="acesso-avaliador">
        <i class="bi bi-person-badge"></i>
        Avaliador e Coordenador
    </a>

    <button type="button" id="btnPorQueAvaliamos" class="link-por-que-avaliamos">
        <i class="bi bi-volume-up"></i>
        Por que fazemos essa avaliação?
    </button>

    <footer>SAFE © 2026 — desenvolvido por Gibabit</footer>

</div>

<div id="modalPorQueAvaliamos" class="modal">

    <div class="modal-content" style="max-width:420px; text-align:center;">

        <h3>Por que fazemos essa avaliação?</h3>

        <p style="color:#64748b; font-size:14px; margin:10px 0 18px;">
            Ouça a explicação sobre o propósito da avaliação física escolar.
        </p>

        <audio id="audioPorQueAvaliamos" controls style="width:100%;" preload="none">
            <source src="assets/audio/por-que-avaliamos.mp3" type="audio/mpeg">
        </audio>

        <button type="button" id="btnFecharPorQueAvaliamos" class="btn-secondary" style="margin-top:18px;">
            Fechar
        </button>

    </div>

</div>

<script type="module" src="js/core/index.js"></script>

</body>
</html>
